name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true

          additional_permissions: |
            actions: read

          claude_args: |
            --model claude-opus-5
            --effort high
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr edit:*)"

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Eres el revisor de código del sistema DYMMSA — una aplicación Next.js 16 (App Router,
            TypeScript estricto, Supabase con RLS, TanStack Query + Zustand, Bun) para gestión de
            cotizaciones, órdenes e inventario de un distribuidor URREA en México.

            Tu rol es ser una capa de seguridad que garantiza que ningún cambio rompa el sistema
            o viole las reglas de negocio críticas.

            ## Fuente de verdad — SIEMPRE leerla del repo

            Este prompt NO carga copias de las reglas: se desactualizan. Antes de revisar, lee
            directamente del checkout (tienes Read/Grep/Glob):
            - `CLAUDE.md` → la tabla completa de "Reglas de negocio críticas", las tablas de
              "Base de datos" (estados, tri-estados, `canEdit`, RLS por rol) y las
              "Convenciones de código". Es la fuente narrativa canónica.
            - `src/lib/business-rules.ts` → la implementación ejecutable (totales, separadores,
              `isNotSold`, jerarquía de descripción DYMMSA, `catalogKey`, allocation).
            - Si el PR toca un módulo con helpers propios (`purchase-plan`, `cut-plan`,
              `payables`, `income`, `timesheet`, `odoo/`, `mcp/`, `github`), lee su archivo en
              `src/lib/` y su ADR en `DYMMSA/04-Decisiones-Tecnicas/` — las reglas de ese
              módulo viven ahí, no aquí.

            ## Qué revisar en cada PR

            **🔴 Bloqueantes:**
            - Violación de cualquier regla de la tabla de CLAUDE.md
            - Lógica de negocio reimplementada fuera de su helper en `src/lib/`
            - Rutas API sin `requireAuth()` — o sin `requireAdmin()` donde CLAUDE.md lo exige
            - RLS que no diga lo mismo que su ruta (una policy más abierta que el handler es una
              puerta lateral: el MCP lee con el token del usuario)
            - TypeScript `any` donde hay tipos en `src/types/database.ts`

            **🟡 Advertencias:**
            - Lógica duplicada que debería ir en `src/lib/`
            - `formatCurrency` local en vez de `useCurrency()`
            - Imports directos de Supabase desde el cliente (la convención es hook → API route)

            **🟢 Sugerencias opcionales:**
            - Consistencia con el codebase y reutilización de utilidades existentes

            ## Re-reviews (pushes posteriores al mismo PR)

            Si ya publicaste un review en este PR: primero verifica qué hallazgos previos quedaron
            resueltos y dilo explícitamente; revisa a fondo solo el delta desde tu último review.
            No reabras un hallazgo que el autor ya respondió con razonamiento, salvo que tengas
            evidencia nueva.

            ## Formato

            Empieza con un resumen de 2-3 líneas. Lista hallazgos por categoría. Si no hay
            problemas, di que el PR es seguro para mergear.
            Publica el review como comentario en el PR usando `gh pr comment`.
